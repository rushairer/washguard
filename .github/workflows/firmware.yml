name: 固件构建

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build-acquisition:
    name: 编译 WG-EXP-001 采集固件
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PlatformIO
        run: python -m pip install --upgrade platformio

      - name: 编译采集固件
        run: pio run -d firmware/acquisition
